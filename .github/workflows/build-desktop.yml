name: Build desktop

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      # latest.yml + the blockmap are what the in-app updater reads: the version, the installer's sha512, and the
      # blocks a differential download can skip. Missing yml = an update nobody can install, so fail here instead.
      - name: Check the updater feed exists
        shell: bash
        run: |
          ls -la dist/
          test -f dist/latest.yml || { echo "latest.yml missing: the updater would have nothing to read"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build AppImage + deb
        run: npm run dist:linux

      # latest-linux.yml lists BOTH files: the AppImage swaps itself, the .deb goes through dpkg.
      - name: Check the updater feed exists
        run: |
          ls -la dist/
          test -f dist/latest-linux.yml || { echo "latest-linux.yml missing: the updater would have nothing to read"; exit 1; }
          grep -q "Nebula.AppImage" dist/latest-linux.yml || { echo "the AppImage is not in latest-linux.yml"; exit 1; }
          grep -q "Nebula.deb" dist/latest-linux.yml || { echo "the deb is not in latest-linux.yml"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  release:
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      # One release for both platforms: two workflows cutting the same tag would race and one would
      # delete the other's assets. The tag follows package.json, so a version bump can never re-cut the old release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          ls -la out/windows out/linux
          # the notes go through a file: an inline multi-line string would carry this step's
          # indentation into the release body, and four leading spaces are a code block in markdown
          cat > notes.md <<'EOF'
          Sound, on files that carry more than one soundtrack.

          A film often ships its main 5.1 soundtrack in a format this app has to convert, alongside a second track — a commentary, or a stereo mix — in one the app plays as it is. Until now the app looked only at the first track it found: if that one played, it left the file alone, and the browser engine underneath quietly dropped the main soundtrack. You got the commentary, the Audio menu listed nothing else, and there was no way to reach the track you actually wanted. Now the app converts a file whenever any of its soundtracks needs it, lists every track, and starts on the one the film marks as its main.

          Two smaller ones alongside it: files with MPEG layer II or Apple Lossless audio now convert instead of playing silently, and a 10-bit HEVC video is handled as 10-bit rather than being handed to a decoder that only takes 8-bit and stalling part way through.

          Linux: the AppImage needs no install — download it, allow it to run as a program, and open it. The .deb installs it like any other app, with a menu entry, and asks for your password when it updates itself. On Windows, Setup is the installer and Portable runs without installing; neither is signed, so SmartScreen may warn the first time (More info, then Run anyway).
          EOF
          gh release delete "v$V" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$V" out/windows/* out/linux/* \
            --title "Nebula (desktop) v$V" \
            --notes-file notes.md
