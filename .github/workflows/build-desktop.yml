name: Build desktop

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      # latest.yml + the blockmap are what the in-app updater reads: the version, the installer's sha512, and the
      # blocks a differential download can skip. Missing yml = an update nobody can install, so fail here instead.
      - name: Check the updater feed exists
        shell: bash
        run: |
          ls -la dist/
          test -f dist/latest.yml || { echo "latest.yml missing: the updater would have nothing to read"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build AppImage + deb
        run: npm run dist:linux

      # latest-linux.yml lists BOTH files: the AppImage swaps itself, the .deb goes through dpkg.
      - name: Check the updater feed exists
        run: |
          ls -la dist/
          test -f dist/latest-linux.yml || { echo "latest-linux.yml missing: the updater would have nothing to read"; exit 1; }
          grep -q "Nebula.AppImage" dist/latest-linux.yml || { echo "the AppImage is not in latest-linux.yml"; exit 1; }
          grep -q "Nebula.deb" dist/latest-linux.yml || { echo "the deb is not in latest-linux.yml"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  release:
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      # One release for both platforms: two workflows cutting the same tag would race and one would
      # delete the other's assets. The tag follows package.json, so a version bump can never re-cut the old release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          ls -la out/windows out/linux
          # the notes go through a file: an inline multi-line string would carry this step's
          # indentation into the release body, and four leading spaces are a code block in markdown
          cat > notes.md <<'EOF'
          Nebula runs on Linux from this version. The AppImage needs no install: download it, allow it to run as a program, and open it. The .deb installs it like any other app, with a menu entry. Both update themselves the way the Windows build does: the app looks for a new version when it starts and every few hours, shows a banner and a row under Settings > About, and installs it on restart. The .deb asks for your password at that point, because it is installed for the whole machine.

          On Windows, Setup is the installer and Portable runs without installing. Neither is signed, so SmartScreen may warn the first time (More info, then Run anyway). This is the first release that Windows 1.61.0 can install by itself.

          From 1.60.0: a file the app cannot decode is converted as it plays instead of ending in an error, and a stream that really cannot play says what its host did. From 1.59.0: files with Dolby Digital, Dolby Digital Plus, DTS or TrueHD audio play with sound.
          EOF
          gh release delete "v$V" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$V" out/windows/* out/linux/* \
            --title "Nebula (desktop) v$V" \
            --notes-file notes.md
