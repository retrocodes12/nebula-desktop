name: Build desktop

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      # latest.yml + the blockmap are what the in-app updater reads: the version, the installer's sha512, and the
      # blocks a differential download can skip. Missing yml = an update nobody can install, so fail here instead.
      - name: Check the updater feed exists
        shell: bash
        run: |
          ls -la dist/
          test -f dist/latest.yml || { echo "latest.yml missing: the updater would have nothing to read"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build AppImage + deb
        run: npm run dist:linux

      # latest-linux.yml lists BOTH files: the AppImage swaps itself, the .deb goes through dpkg.
      - name: Check the updater feed exists
        run: |
          ls -la dist/
          test -f dist/latest-linux.yml || { echo "latest-linux.yml missing: the updater would have nothing to read"; exit 1; }
          grep -q "Nebula.AppImage" dist/latest-linux.yml || { echo "the AppImage is not in latest-linux.yml"; exit 1; }
          grep -q "Nebula.deb" dist/latest-linux.yml || { echo "the deb is not in latest-linux.yml"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  release:
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      # One release for both platforms: two workflows cutting the same tag would race and one would
      # delete the other's assets. The tag follows package.json, so a version bump can never re-cut the old release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          ls -la out/windows out/linux
          # the notes go through a file: an inline multi-line string would carry this step's
          # indentation into the release body, and four leading spaces are a code block in markdown
          cat > notes.md <<'EOF'
          Share with your TV.

          A TV has very little memory to keep video in, which is why a stream can run dry on the TV while the same connection is perfectly fine on this computer. Turn Share with your TV on in Settings, sign this computer and the TV into the same profile, and the TV plays through here instead: this machine holds the video the TV is about to need, far more of it than the TV could ever hold itself, and reads on ahead of where the TV has got to. Nothing is written to disk and nothing leaves your network. Windows asks once whether to let Nebula accept connections on your network — it needs a yes on your private network for the TV to reach it. If this computer sleeps or leaves the network, the TV says so and carries on playing directly.

          When a source keeps stalling, Nebula now offers a switch. After three stalls in a minute and a half a button appears over the controls naming another source for the same thing; one press moves you to it at the same second, and the rest of the series follows the source that worked.

          Streams your connection cannot carry are marked. Nebula remembers how fast your connection actually is, marks the rows that ask for more than it can deliver, moves them down the list and stops choosing them for you. You can still pick one yourself, and the marking can be turned off in Settings under Streams.

          Buffer ahead now loads several pieces of video at once rather than one after another, so the buffer fills faster on a slow or far-away source.

          Linux: the AppImage needs no install — download it, allow it to run as a program, and open it. The .deb installs it like any other app, with a menu entry, and asks for your password when it updates itself. On Windows, Setup is the installer and Portable runs without installing; neither is signed, so SmartScreen may warn the first time (More info, then Run anyway).
          EOF
          gh release delete "v$V" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$V" out/windows/* out/linux/* \
            --title "Nebula (desktop) v$V" \
            --notes-file notes.md
