name: Build desktop

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # libmpv for the full-format player (mpv.js): the baseline x86-64 build (the -v3 ones need AVX2), pinned by its hash
      - name: Fetch libmpv (Windows)
        shell: bash
        run: |
          curl -fsSL -o mpv-dev.7z "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260903/mpv-dev-x86_64-20260903-git-69e63f425a.7z"
          echo "fac135c68a35b7639e39d72c0c365104edbaebdea39a0dfdd8c36e8c8e80faef  mpv-dev.7z" | sha256sum -c -
          mkdir -p build/mpv/win && 7z e mpv-dev.7z -obuild/mpv/win libmpv-2.dll -y > /dev/null
          ls -la build/mpv/win

      # the full-format player's helper (helper/nebula-mpv.c), MinGW-w64, linked statically: it needs nothing but libmpv-2.dll
      # beside it. The runner's own gcc when it has one, else MSYS2's.
      - name: Build the player helper (Windows)
        shell: bash
        run: |
          G=$(command -v gcc || true)
          if [ -z "$G" ]; then /c/msys64/usr/bin/pacman -S --noconfirm --needed mingw-w64-x86_64-gcc > /dev/null; G=/c/msys64/mingw64/bin/gcc; fi
          "$G" --version | head -1
          "$G" -O2 -Wall -Wextra -Werror -static -municode -o build/mpv/win/nebula-mpv.exe helper/nebula-mpv.c helper/frames.c -lwinmm -lws2_32
          ls -la build/mpv/win

      # the helper and the libmpv it ships, driven the way the app drives them (probe, frames, pause, a seek), inside Electron's runtime
      - name: Smoke-test the full-format player
        shell: bash
        run: |
          F=node_modules/ffmpeg-static/ffmpeg.exe; X="-hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=24"
          $F $X -f lavfi -i sine=frequency=440 -t 4 -c:v libx264 -c:a ac3 -y smoke.mkv
          $F $X -t 3 -c:v libx265 -preset ultrafast -pix_fmt yuv420p10le -x265-params log-level=error -color_primaries bt2020 -color_trc smpte2084 -colorspace bt2020nc -y hdr.mkv
          $F $X -t 3 -c:v libx265 -preset ultrafast -pix_fmt yuv420p10le -x265-params log-level=error -color_primaries bt709 -color_trc bt709 -colorspace bt709 -y sdr.mkv
          NEBULA_MPV_AO=null HDR_PAIR=hdr.mkv,sdr.mkv ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron.exe scripts/mpv-smoke.cjs smoke.mkv

      - name: Build Windows installer + portable
        run: npm run dist

      # latest.yml + the blockmap are what the in-app updater reads: the version, the installer's sha512, and the
      # blocks a differential download can skip. Missing yml = an update nobody can install, so fail here instead.
      - name: Check the updater feed exists
        shell: bash
        run: |
          ls -la dist/
          test -f dist/latest.yml || { echo "latest.yml missing: the updater would have nothing to read"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # libmpv for the full-format player: Ubuntu 22.04's build plus the two libraries a stock system may lack, carried by the
      # AppImage and the deb (a system's own libmpv2 or libmpv1 is tried first), pinned by their hashes
      - name: Fetch libmpv (Linux)
        run: |
          set -e
          B=http://archive.ubuntu.com/ubuntu/pool/universe
          curl -fsSL -o libmpv1.deb $B/m/mpv/libmpv1_0.34.1-1ubuntu3_amd64.deb
          curl -fsSL -o libmujs1.deb $B/m/mujs/libmujs1_1.1.3-3_amd64.deb
          curl -fsSL -o libsixel1.deb $B/libs/libsixel/libsixel1_1.10.3-3_amd64.deb
          printf '%s  %s\n' 5505f4fc5a3f985d27b54f0ae6ca922a33906b3cd90cf2245205ea7739d9e407 libmpv1.deb \
            91e7be9ccb0252d8c9f35f3ecdcbc984f3d412d174e057fda04ff608e3ff440d libmujs1.deb \
            ef28327242ed49e1c77a070ced23fad258937b496f648211bd8a61e23ef08f5c libsixel1.deb | sha256sum -c -
          for d in libmpv1 libmujs1 libsixel1; do dpkg-deb -x $d.deb deb-root; done
          mkdir -p build/mpv/linux
          L=deb-root/usr/lib/x86_64-linux-gnu
          cp -L $L/libmpv.so.1 $L/libmujs.so.1 $L/libsixel.so.1 build/mpv/linux/
          ls -la build/mpv/linux

      # the full-format player's helper, built against Ubuntu 20.04's glibc (2.31) so it starts wherever the app does
      - name: Build the player helper (Linux)
        run: |
          docker run --rm -v "$PWD":/w -w /w ubuntu:20.04 bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc libc6-dev > /dev/null \
            && gcc -O2 -Wall -Wextra -Werror -o build/mpv/linux/nebula-mpv helper/nebula-mpv.c helper/frames.c -ldl -lpthread && chmod 0755 build/mpv/linux/nebula-mpv \
            && chown '"$(id -u):$(id -g)"' build/mpv/linux/nebula-mpv'
          ls -la build/mpv/linux
          echo "newest glibc it asks for: $(objdump -T build/mpv/linux/nebula-mpv | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"

      # the helper against the runner's own libmpv2 (a newer mpv than the one carried — the probe must pick it), driven as the app drives it
      - name: Smoke-test the full-format player
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libmpv2 > /dev/null
          F=node_modules/ffmpeg-static/ffmpeg; X="-hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=24"
          $F $X -f lavfi -i sine=frequency=440 -t 4 -c:v libx264 -c:a ac3 -y smoke.mkv
          $F $X -t 3 -c:v libx265 -preset ultrafast -pix_fmt yuv420p10le -x265-params log-level=error -color_primaries bt2020 -color_trc smpte2084 -colorspace bt2020nc -y hdr.mkv
          $F $X -t 3 -c:v libx265 -preset ultrafast -pix_fmt yuv420p10le -x265-params log-level=error -color_primaries bt709 -color_trc bt709 -colorspace bt709 -y sdr.mkv
          NEBULA_MPV_AO=null HDR_PAIR=hdr.mkv,sdr.mkv ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron scripts/mpv-smoke.cjs smoke.mkv

      # the libmpv the packages carry (Ubuntu 22.04's) on the system family it is for: its libraries installed, the package
      # itself taken away again, so the probe must find the carried copy beside the helper
      - name: Smoke-test the carried libmpv (Ubuntu 22.04)
        run: |
          NODE_DIR=$(dirname "$(command -v node)")
          docker run --rm -v "$PWD":/w -v "$NODE_DIR":/nodebin:ro -w /w ubuntu:22.04 bash -c 'set -e
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libmpv1 > /dev/null
            dpkg -r --force-depends libmpv1 > /dev/null
            test ! -e /usr/lib/x86_64-linux-gnu/libmpv.so.1
            NEBULA_MPV_AO=null HDR_PAIR=hdr.mkv,sdr.mkv /nodebin/node scripts/mpv-smoke.cjs smoke.mkv'

      - name: Build AppImage + deb
        run: npm run dist:linux

      # latest-linux.yml lists BOTH files: the AppImage swaps itself, the .deb goes through dpkg.
      - name: Check the updater feed exists
        run: |
          ls -la dist/
          test -f dist/latest-linux.yml || { echo "latest-linux.yml missing: the updater would have nothing to read"; exit 1; }
          grep -q "Nebula.AppImage" dist/latest-linux.yml || { echo "the AppImage is not in latest-linux.yml"; exit 1; }
          grep -q "Nebula.deb" dist/latest-linux.yml || { echo "the deb is not in latest-linux.yml"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  release:
    needs: [ windows, linux ]
    if: github.ref == 'refs/heads/main'   # a run started on another branch (workflow_dispatch) builds and tests both, never releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      # One release for both platforms: two workflows cutting the same tag would race and one would
      # delete the other's assets. The tag follows package.json, so a version bump can never re-cut the old release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          ls -la out/windows out/linux
          # the notes go through a file: an inline multi-line string would carry this step's
          # indentation into the release body, and four leading spaces are a code block in markdown
          cat > notes.md <<'EOF'
          Subtitles from your add-ons now come on by themselves in your preferred language (Settings, Subtitles when a video starts) when the stream has none of its own, trying the next file if one will not load. A subtitle you pick by hand comes back when you switch to another source of the same title.
          EOF
          gh release delete "v$V" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$V" out/windows/* out/linux/* \
            --title "Nebula (desktop) v$V" \
            --notes-file notes.md
