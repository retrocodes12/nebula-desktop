name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.46.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.46.0 dist/*.exe \
            --title "Nebula (Windows) v1.46.0" \
            --notes "Pause and the screen tells you what you are watching, how long is left and what plays next. Press i for a playback-info HUD (picture, codec, connection, buffer, dropped frames). Nudge subtitle timing from the Subtitles menu, pick a picture-quality policy in Settings, and jump back to the live edge with one button. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
