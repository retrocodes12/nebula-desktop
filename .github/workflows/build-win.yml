name: Build Windows

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the tag follows package.json, so a version bump can never re-cut the old release
          V=$(node -p "require('./package.json').version")
          gh release delete "v$V" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$V" dist/*.exe \
            --title "Nebula (Windows) v$V" \
            --notes "Windows plays everything now. Files with Dolby Digital, Dolby Digital Plus, DTS or TrueHD audio, which the app could not voice before, play with sound: the app converts the audio as it plays, keeps the video untouched, and lists the file's languages under Audio. Video the machine cannot decode is converted too. The installer is larger for it. Plus the fix pass from 1.57.0: add-ons, profile, settings and progress survive closing the app, files with several audio tracks offer the choice under Audio, a dropped file plays, the stock menu bar is gone, F11 goes fullscreen, and closing mid-playback saves your place. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
