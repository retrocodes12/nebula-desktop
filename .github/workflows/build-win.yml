name: Build Windows

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the tag follows package.json, so a version bump can never re-cut the old release
          V=$(node -p "require('./package.json').version")
          gh release delete "v$V" -y --cleanup-tag 2>/dev/null || true
          # latest.yml + the blockmap are what the in-app updater reads: the version, the installer's sha512, and the
          # blocks a differential download can skip. The names are versionless so the update links stay evergreen.
          ls -la dist/
          test -f dist/latest.yml || { echo "latest.yml missing: the updater would have nothing to read"; exit 1; }
          gh release create "v$V" dist/*.exe dist/*.blockmap dist/latest.yml \
            --title "Nebula (Windows) v$V" \
            --notes "Nebula updates itself now. The app checks for a new version when it starts and every few hours, shows a banner and a row under Settings > About, downloads the update when you ask, and installs it on restart. The portable build swaps itself for the new file in the same folder. This is the first version with the updater, so this one update is by hand; from here on the app does it. From 1.60.0: a file Windows refuses to open is converted as it plays instead of ending in a 3016 error, and a stream that really cannot play says what its host did. From 1.59.0: files with Dolby Digital, Dolby Digital Plus, DTS or TrueHD audio play with sound. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
