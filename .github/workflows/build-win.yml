name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.48.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.48.0 dist/*.exe \
            --title "Nebula (Windows) v1.48.0" \
            --notes "Home is yours to arrange: Settings has a new Home panel where every catalog your add-ons offer is listed. Switch rows on or off, drag them into the order you want, and Reset when you change your mind. Home draws its rows in that order, with a Customise Home link under the last row. Search remembers your recent searches as chips, newest first, with a Clear. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
