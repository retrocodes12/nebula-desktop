name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.12.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.12.0 dist/*.exe \
            --title "Nebula (Windows) v1.12.0" \
            --notes "Your player, everywhere you watch. Every title now opens on its own page - artwork, year, runtime, rating and description - with a Play button that knows where you stopped (it reads Resume S2E4, not just Play). A My List library collects what you are watching, and saved series show their next dated episodes in an Upcoming list grouped by day. Devices now sync without an account: link this PC to your TV or browser with a 6-character code from the Add-ons tab, and add-ons, watch progress, My List and subtitle style follow you everywhere - newest change wins. Also new: play a local video file straight from the Add-ons tab, subtitle tracks are named by language instead of a raw code, and watch parties ride a faster relay with automatic fallback. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
