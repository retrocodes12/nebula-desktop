name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.11.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.11.0 dist/*.exe \
            --title "Nebula (Windows) v1.11.0" \
            --notes "A new look. Nebula now uses an Apple-style interface — layered surfaces over a true-black ground, a translucent top bar, soft rounded artwork, and a highlight that lifts and enlarges what you are pointing at instead of drawing a box around it. Underneath: it remembers where you stopped, with a Continue Watching row that picks any half-finished film or episode back up at the second you left it; episodes show a tick when watched and a bar when part-way; a series keeps rolling on its own, offering the next episode near the end and playing it automatically when one finishes. Search now covers every searchable catalogue an add-on offers, so searching a show name returns shows and not just films. Catalogues load further pages as you scroll instead of stopping at the first hundred items, and lists show placeholder rows while they load. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
