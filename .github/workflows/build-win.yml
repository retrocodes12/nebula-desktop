name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.50.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.50.0 dist/*.exe \
            --title "Nebula (Windows) v1.50.0" \
            --notes "Evenings, sorted. A sleep timer in the player (Z, or the Sleep pill) pauses after 15 to 90 minutes or when the episode you are on ends, and it rides along through the next episode. Anything you have started now offers Start over: on the streams page, and by right-clicking a Continue watching card. Series pages have Surprise me, a random episode that has aired. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
