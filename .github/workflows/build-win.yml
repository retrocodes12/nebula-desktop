name: Build Windows

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.53.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.53.0 dist/*.exe \
            --title "Nebula (Windows) v1.53.0" \
            --notes "Scrub preview. Move the mouse along the timeline and a small card shows the time you would land on, with a picture of that moment when the stream allows it; with the scrubber focused, Left and Right preview the jump and Enter takes it. Also fixed: the Up next card no longer sits on top of the subtitles panel. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
