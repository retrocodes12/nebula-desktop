name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.44.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.44.0 dist/*.exe \
            --title "Nebula (Windows) v1.44.0" \
            --notes "A quieter, more premium interface: hairline panels, a mono eyebrow register, outlined chips and ghost buttons, a compact rating pill with an IMDb plate, episodes as a list, segmented settings, and dialogs that sit centred on a desktop. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
