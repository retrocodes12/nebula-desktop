name: Build Windows

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.55.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.55.0 dist/*.exe \
            --title "Nebula (Windows) v1.55.0" \
            --notes "A finish pass. Library has tabs for My List, Continue Watching and Upcoming with clear empty states, Settings sections carry titles and subtitles, screens fade into one another, loading rows shimmer, messages sit under the navigation, and Continue Watching cards show the episode, the time left and a progress bar. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
