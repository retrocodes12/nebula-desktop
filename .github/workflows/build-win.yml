name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.14.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.14.0 dist/*.exe \
            --title "Nebula (Windows) v1.14.0" \
            --notes "One design language everywhere: the Title Card look now dresses Home and every title page as well as playback - an italic serif signature, letterspaced caps titles, hairline ticker row headers, hard-edged posters with rating badges, and word controls with underlines. Also repairs v1.13.0, which shipped with the browse-surface styles missing. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
