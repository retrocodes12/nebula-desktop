name: Build Windows

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.52.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.52.0 dist/*.exe \
            --title "Nebula (Windows) v1.52.0" \
            --notes "A new player layout. Under the title, the source you are watching from; time pills at both ends of the scrubber, the right one switching between time left and total; one centred toolbar with icons for Next, Subtitles, Audio, Quality, Speed, Sleep and Party; the clock and the end time top right. Subtitles open a full panel: languages with counts, each language's tracks and where they came from, timing and appearance alongside. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
