name: Build Windows

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the tag follows package.json, so a version bump can never re-cut the old release
          V=$(node -p "require('./package.json').version")
          gh release delete "v$V" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$V" dist/*.exe \
            --title "Nebula (Windows) v$V" \
            --notes "A file Windows refuses to open no longer ends in a 3016 error. When the built-in player cannot open a file at all (a format it cannot decode, or a container such as TS or AVI), the app now converts it as it plays; direct links without a file extension get the same treatment. When a stream really cannot play, the message says what happened: the host answered 403, or sent a page instead of the video. The app also fetches files with the same identity the player uses, so a host that served the page serves the converter. From 1.59.0: files with Dolby Digital, Dolby Digital Plus, DTS or TrueHD audio play with sound, video the machine cannot decode is converted, and the file's languages are listed under Audio. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
