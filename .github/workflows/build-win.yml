name: Build Windows

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the tag follows package.json, so a version bump can never re-cut the old release
          V=$(node -p "require('./package.json').version")
          gh release delete "v$V" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$V" dist/*.exe \
            --title "Nebula (Windows) v$V" \
            --notes "The Windows fix pass. Your add-ons, profile, settings and progress now survive closing the app (every launch used to start over). Files with several audio tracks offer the choice under Audio. Dropping a video file onto the window plays it. The stock menu bar and its shortcuts are gone, F11 goes fullscreen like the f key, and closing mid-playback saves your place before the window goes. Watch parties reach the relay again. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
