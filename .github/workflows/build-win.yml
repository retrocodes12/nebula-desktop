name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.13.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.13.0 dist/*.exe \
            --title "Nebula (Windows) v1.13.0" \
            --notes "Nebula opens full now and plays even fuller. First run preinstalls starter add-ons, Home leads with a featured hero board - full-bleed artwork and the title's own logo - and every title page went full-bleed with cast and credits. The playback surface itself was redesigned as a cinema title card: serif type in letterspaced caps, an italic line that speaks the player's state, whispered word controls, a hairline seek, and an ornamental frame. No accent hue - the film supplies the colour. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
