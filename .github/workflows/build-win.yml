name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.10.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.10.0 dist/*.exe \
            --title "Nebula (Windows) v1.10.0" \
            --notes "Nebula now remembers where you stopped. A Continue watching row on Home picks any half-finished film or episode back up at the second you left it, episodes show a tick when watched and a bar when part-way through, and a series keeps rolling on its own — the next episode is offered near the end and plays automatically when one finishes. Search now covers every searchable catalogue an add-on offers, so searching a show name finally returns shows and not just films. Catalogues load further pages as you scroll instead of stopping at the first hundred items. Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
