name: Build Windows

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.51.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.51.0 dist/*.exe \
            --title "Nebula (Windows) v1.51.0" \
            --notes "Skip intro. A pill appears over an episode's recap and opening titles; click it (or press Enter) to jump past them, or set Auto in Settings > Playback and it skips for you. The closing credits bring Up next forward. Audio now always sits in the controls, naming the one track when there is nothing to pick. Also fixed: profiles, sync, phone pairing and watch parties on Windows reach Nebula's server again (they were pointed at the app's own local server). Setup is the installer; Portable runs without installing. Unsigned, so Windows SmartScreen may warn (More info -> Run anyway)."
